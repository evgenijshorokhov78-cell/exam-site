<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя статистика — Пробный ЕГЭ по информатике</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header class="navbar">
        <span class="logo">💻 Пробный ЕГЭ — Информатика</span>
        <nav>
            <a href="dashboard.html">Кабинет</a>
            <a href="exams.html">Экзамены</a>
            <a href="stats.html">Моя статистика</a>
            <a href="#" id="logoutBtn">Выйти</a>
        </nav>
    </header>

    <main>
        <h1>Моя статистика</h1>

        <div id="loading" style="text-align: center; padding: 60px 20px; color: #888;">
            <div style="display: inline-block; width: 40px; height: 40px;
                        border: 4px solid #e0e0e0; border-top-color: #3498db;
                        border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
            <p style="margin-top: 16px; font-size: 15px;">Загрузка данных...</p>
        </div>

        <div id="content" style="display: none;"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // ⚠️ ЗАМЕНИ НА СВОЙ URL
        const API_URL = "https://script.google.com/macros/s/AKfycbwHGMlNY57d9v67PpM2JS0S0nrTPUlLbpfbCE4yk7ELyWBLBmiURgrzC2ujRv2258_7Cw/exec";

        const token = localStorage.getItem('authToken');
        const userJson = localStorage.getItem('userInfo');

        if (!token || !userJson) {
            window.location.href = 'login.html';
        }
        const user = JSON.parse(userJson);

        document.getElementById('logoutBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                await fetch(`${API_URL}?action=logout&token=${encodeURIComponent(token)}`);
            } catch (err) {}
            localStorage.removeItem('authToken');
            localStorage.removeItem('userInfo');
            window.location.href = 'login.html';
        });

        async function loadStats() {
            const content = document.getElementById('content');
            const loading = document.getElementById('loading');

            try {
                const url = `${API_URL}?action=getUserResults&token=${encodeURIComponent(token)}`;
                const response = await fetch(url);
                const data = await response.json();

                // Если токен недействителен — выкидываем
                if (!data.success) {
                    if (data.error === "Не авторизован") {
                        localStorage.removeItem('authToken');
                        localStorage.removeItem('userInfo');
                        window.location.href = 'login.html';
                        return;
                    }
                    loading.style.display = 'none';
                    content.style.display = 'block';
                    content.innerHTML = `<section class="card"><p style="color: #e74c3c;">Ошибка: ${data.error}</p></section>`;
                    return;
                }

                loading.style.display = 'none';
                content.style.display = 'block';

                const results = data.results || [];

                if (results.length === 0) {
                    content.innerHTML = `
                        <section class="card" style="text-align: center; padding: 40px;">
                            <p style="color: #888; font-size: 18px;">У вас пока нет результатов.</p>
                            <p style="color: #aaa; margin-top: 8px;">После первого пробного экзамена здесь появится ваша статистика.</p>
                        </section>
                    `;
                    return;
                }

                // ====== СВОДКА ======
                const testScores = results.map(r => r.test);
                const avgTest = (testScores.reduce((a, b) => a + b, 0) / testScores.length).toFixed(1);
                const bestTest = Math.max(...testScores);
                const bestResult = results.find(r => r.test === bestTest);
                const firstTest = results[results.length - 1].test;
                const lastTest = results[0].test;
                const growth = lastTest - firstTest;
                const growthSign = growth >= 0 ? '+' : '';

                // ====== АНАЛИЗ ПО ВСЕМ 27 ЗАДАНИЯМ ======
                const tasksProblems = [];
                const taskTotal = results.length;

                for (let num = 1; num <= 27; num++) {
                    let wrongCount = 0;
                    let partialCount = 0;
                    let topic = "";

                    results.forEach(r => {
                        if ((r.wrongTasks || []).includes(num)) wrongCount++;
                        if ((r.partialTasks || []).includes(num)) partialCount++;

                        if (r.tasksStats) {
                            const t = r.tasksStats.find(x => x.num === num);
                            if (t && t.topic) topic = t.topic;
                        }
                    });

                    if (!topic) topic = `Задание ${num}`;

                    const failCount = wrongCount + partialCount;
                    const rate = taskTotal > 0 ? Math.round(failCount * 100 / taskTotal) : 0;

                    tasksProblems.push({
                        num: num,
                        topic: topic,
                        wrongCount: wrongCount,
                        partialCount: partialCount,
                        total: taskTotal,
                        rate: rate
                    });
                }

                // ====== РИСУЕМ ======
                content.innerHTML = `
                    <section class="grid">
                        <div class="card">
                            <h2>Средний тестовый балл</h2>
                            <p style="font-size: 36px; font-weight: bold; color: #3498db;">${avgTest}</p>
                            <p style="color: #888;">за ${results.length} экзамен(ов)</p>
                        </div>

                        <div class="card">
                            <h2>Рост за период</h2>
                            <p style="font-size: 36px; font-weight: bold; color: ${growth >= 0 ? '#27ae60' : '#e74c3c'};">
                                ${growthSign}${growth}
                            </p>
                            <p style="color: #888;">от первого к последнему</p>
                        </div>

                        <div class="card">
                            <h2>Пройдено экзаменов</h2>
                            <p style="font-size: 36px; font-weight: bold; color: #f39c12;">${results.length}</p>
                            <p style="color: #888;">в этом учебном году</p>
                        </div>

                        <div class="card">
                            <h2>Лучший результат</h2>
                            <p style="font-size: 36px; font-weight: bold; color: #27ae60;">${bestTest}</p>
                            <p style="color: #888;">${bestResult.exam}</p>
                        </div>
                    </section>

                    <section class="card">
                        <h2>Динамика баллов</h2>
                        <canvas id="progressChart" height="100"></canvas>
                    </section>

                    <h2 class="section-title">Все результаты</h2>

                    <section class="card">
                        <table>
                            <thead>
                                <tr>
                                    <th>Экзамен</th>
                                    <th>Первичный</th>
                                    <th>Тестовый</th>
                                    <th style="width: 120px;"></th>
                                </tr>
                            </thead>
                            <tbody>
                                ${results.map(r => `
                                    <tr>
                                        <td>${r.exam}</td>
                                        <td>${r.primary} / 29</td>
                                        <td><strong>${r.test}</strong></td>
                                        <td>
                                            <a href="result.html?exam=${encodeURIComponent(r.exam)}"
                                               class="btn" style="padding: 6px 14px; font-size: 14px;">
                                                Разбор
                                            </a>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </section>

                    <h2 class="section-title">Сложности при выполнении заданий</h2>

                    <section class="card">
                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 50px;">№</th>
                                    <th>Тема задания</th>
                                    <th style="width: 100px;">Ошибок</th>
                                    <th style="width: 130px;">Процент провала</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tasksProblems.map(p => `
                                    <tr>
                                        <td><strong>${p.num}</strong></td>
                                        <td>${p.topic}</td>
                                        <td>${p.wrongCount + p.partialCount} из ${p.total}</td>
                                        <td>
                                            <span class="badge ${p.rate >= 75 ? 'badge-red' : (p.rate >= 50 ? 'badge-yellow' : 'badge-green')}">
                                                ${p.rate}%
                                            </span>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </section>
                `;

                // ====== ГРАФИК ======
                const chartLabels = results.slice().reverse().map(r => r.exam);
                const chartValues = results.slice().reverse().map(r => r.test);

                const ctx = document.getElementById('progressChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: chartLabels,
                        datasets: [{
                            label: 'Тестовый балл',
                            data: chartValues,
                            borderColor: '#3498db',
                            backgroundColor: 'rgba(52,152,219,.1)',
                            tension: 0.3,
                            fill: true,
                            pointRadius: 6,
                            pointBackgroundColor: '#3498db'
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom' }
                        },
                        scales: {
                            y: {
                                beginAtZero: false,
                                min: 0,
                                max: 100
                            }
                        }
                    }
                });

            } catch (error) {
                loading.style.display = 'none';
                content.style.display = 'block';
                content.innerHTML = `<section class="card"><p style="color: #e74c3c;">Ошибка загрузки: ${error.message}</p></section>`;
            }
        }

        loadStats();
    </script>

</body>
</html>
