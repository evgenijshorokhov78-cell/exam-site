<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Пробный ЕГЭ по информатике</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-msg { color: #721c24; background: #f8d7da; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .success-msg { color: #155724; background: #d4edda; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h1>Вход</h1>
        <div id="message"></div>
        <form id="loginForm">
            <label>Логин<input type="text" id="login" placeholder="Введите логин" required></label>
            <label>Пароль<input type="password" id="password" placeholder="Введите пароль" required></label>
            <button type="submit">Войти</button>
        </form>
        <p class="links">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
    </div>

    <script>
        // ⚠️ ЗАМЕНИ НА СВОЙ URL
        const API_URL = "ВСТАВЬ_СЮДА_ТВОЙ_WEB_APP_URL";

        const form = document.getElementById('loginForm');
        const message = document.getElementById('message');

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('registered') === '1') {
            message.innerHTML = '<div class="success-msg">✅ Регистрация успешна! Теперь войдите.</div>';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const login = document.getElementById('login').value.trim();
            const password = document.getElementById('password').value;
            message.innerHTML = '';

            try {
                const url = `${API_URL}?action=checkLogin&login=${encodeURIComponent(login)}&password=${encodeURIComponent(password)}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.success) {
                    // ⚠️ Сохраняем ТОКЕН, не пароль
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('userInfo', JSON.stringify(data.user));

                    if (data.user.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    message.innerHTML = '<div class="error-msg">❌ ' + (data.error || 'Неверный логин или пароль') + '</div>';
                }
            } catch (error) {
                message.innerHTML = '<div class="error-msg">❌ Ошибка соединения: ' + error.message + '</div>';
            }
        });
    </script>

</body>
</html>
