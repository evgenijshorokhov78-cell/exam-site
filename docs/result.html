<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Разбор экзамена — Пробный ЕГЭ по информатике</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <span class="logo">💻 Пробный ЕГЭ — Информатика</span>
        <nav>
            <a href="dashboard.html">Кабинет</a>
            <a href="exams.html">Экзамены</a>
            <a href="stats.html">Моя статистика</a>
            <a href="#" id="logoutBtn">Выйти</a>
        </nav>
    </header>

    <main>
        <a href="stats.html" style="color: #3498db; text-decoration: none;">← К моей статистике</a>

        <h1 id="examTitle" style="margin-top: 16px;">Загрузка...</h1>

        <div id="loading" style="text-align: center; padding: 60px 20px; color: #888;">
            <div style="display: inline-block; width: 40px; height: 40px;
                        border: 4px solid #e0e0e0; border-top-color: #3498db;
                        border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
            <p style="margin-top: 16px; font-size: 15px;">Загрузка данных...</p>
        </div>

        <div id="content" style="display: none;"></div>
    </main>

    <script>
        // ⚠️ ВСТАВЬ СВОЙ URL ИЗ APPS SCRIPT
        const API_URL = "https://script.google.com/macros/s/AKfycbwHGMlNY57d9v67PpM2JS0S0nrTPUlLbpfbCE4yk7ELyWBLBmiURgrzC2ujRv2258_7Cw/exec";

        const userJson = localStorage.getItem('currentUser');
        if (!userJson) {
            window.location.href = 'login.html';
        }
        const user = JSON.parse(userJson);

        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        });

        // Получаем название экзамена из URL (?exam=...)
        const urlParams = new URLSearchParams(window.location.search);
        const examName = urlParams.get('exam');

        if (!examName) {
            window.location.href = 'stats.html';
        }

        document.getElementById('examTitle').textContent = examName;

        async function loadResult() {
            const content = document.getElementById('content');
            const loading = document.getElementById('loading');

            try {
                const url = `${API_URL}?action=getUserResults&login=${encodeURIComponent(user.login)}`;
                const response = await fetch(url);
                const data = await response.json();

                loading.style.display = 'none';
                content.style.display = 'block';

                if (!data.success) {
                    content.innerHTML = `<section class="card"><p style="color: #e74c3c;">Ошибка: ${data.error}</p></section>`;
                    return;
                }

                // Находим нужный экзамен
                const result = (data.results || []).find(r => r.exam === examName);

                if (!result) {
                    content.innerHTML = `
                        <section class="card" style="text-align: center; padding: 40px;">
                            <p style="color: #888; font-size: 18px;">Результат по этому экзамену не найден.</p>
                            <p style="color: #aaa; margin-top: 8px;">Возможно, экзамен был удалён учителем.</p>
                        </section>
                    `;
                    return;
                }

                // Собираем задания — используем tasksStats из Apps Script
                const tasks = result.tasksStats || [];

                if (tasks.length === 0) {
                    content.innerHTML = `
                        <section class="card" style="text-align: center; padding: 40px;">
                            <p style="color: #888;">Нет данных по заданиям.</p>
                        </section>
                    `;
                    return;
                }

                // Считаем сколько решено, частично, не решено
                let solved = 0, partial = 0, wrong = 0;
                tasks.forEach(t => {
                    if (t.score === t.max) solved++;
                    else if (t.score > 0) partial++;
                    else wrong++;
                });

                content.innerHTML = `
                    <section class="card">
                        <h2>Итог</h2>
                        <p style="font-size: 42px; font-weight: bold; color: #3498db;">
                            ${result.test} <span style="font-size: 20px; color: #888;">/ 100</span>
                        </p>
                        <p style="color: #555; margin-top: 4px;">
                            первичный балл: <strong>${result.primary} / 29</strong>
                        </p>

                        <div style="margin-top: 20px;">
                            <div class="stat-row">
                                <span>✅ Решено полностью</span>
                                <strong>${solved} из 27</strong>
                            </div>
                            <div class="stat-row">
                                <span>⚠️ Частично решено</span>
                                <strong>${partial} из 27</strong>
                            </div>
                            <div class="stat-row">
                                <span>❌ Не решено</span>
                                <strong>${wrong} из 27</strong>
                            </div>
                        </div>
                    </section>

                    <h2 class="section-title">Результат по заданиям</h2>

                    <section class="card">
                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 50px;">№</th>
                                    <th>Тема задания</th>
                                    <th style="width: 100px;">Балл</th>
                                    <th style="width: 130px;">Статус</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${tasks.map(t => {
                                    let badgeClass, badgeText;
                                    if (t.score === t.max) {
                                        badgeClass = "badge-green";
                                        badgeText = "Решено";
                                    } else if (t.score > 0) {
                                        badgeClass = "badge-yellow";
                                        badgeText = "Частично";
                                    } else {
                                        badgeClass = "badge-red";
                                        badgeText = "Не решено";
                                    }

                                    return `
                                        <tr>
                                            <td><strong>${t.num}</strong></td>
                                            <td>${t.topic}</td>
                                            <td>${t.score} / ${t.max}</td>
                                            <td><span class="badge ${badgeClass}">${badgeText}</span></td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </section>

                    ${wrong + partial > 0 ? `
                        <h2 class="section-title">Что нужно подтянуть</h2>
                        <section class="card">
                            <ul style="padding-left: 22px;">
                                ${tasks.filter(t => t.score < t.max).map(t => `
                                    <li style="margin-bottom: 6px;">
                                        📌 <strong>№ ${t.num}</strong> — ${t.topic}
                                        ${t.score > 0 ? '<span style="color: #f39c12; font-size: 13px;">(частично)</span>' : ''}
                                    </li>
                                `).join('')}
                            </ul>
                        </section>
                    ` : `
                        <section class="card" style="background: #f4fdf7; border-left: 4px solid #27ae60;">
                            <p style="color: #27ae60; font-weight: bold; margin: 0;">
                                🎉 Все задания решены полностью!
                            </p>
                        </section>
                    `}
                `;

            } catch (error) {
                loading.style.display = 'none';
                content.style.display = 'block';
                content.innerHTML = `<section class="card"><p style="color: #e74c3c;">Ошибка загрузки: ${error.message}</p></section>`;
            }
        }

        loadResult();
    </script>

</body>
</html>
