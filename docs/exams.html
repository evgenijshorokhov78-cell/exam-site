<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экзамены — Пробный ЕГЭ по информатике</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <span class="logo">💻 Пробный ЕГЭ — Информатика</span>
        <nav>
            <a href="dashboard.html">Кабинет</a>
            <a href="exams.html">Экзамены</a>
            <a href="stats.html">Моя статистика</a>
            <a href="#" id="logoutBtn">Выйти</a>
        </nav>
    </header>

    <main>
        <h1>Пробные экзамены по информатике</h1>

        <div id="loading" style="text-align: center; padding: 60px 20px; color: #888;">
            <div style="display: inline-block; width: 40px; height: 40px;
                        border: 4px solid #e0e0e0; border-top-color: #3498db;
                        border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
            <p style="margin-top: 16px; font-size: 15px;">Загрузка данных...</p>
        </div>

        <div id="content" style="display: none;">
            <h2 class="section-title">📅 Предстоящие</h2>
            <div id="upcomingBlock" class="grid"></div>

            <h2 class="section-title">✅ Прошедшие</h2>
            <div id="finishedBlock" class="grid"></div>
        </div>
    </main>

    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwHGMlNY57d9v67PpM2JS0S0nrTPUlLbpfbCE4yk7ELyWBLBmiURgrzC2ujRv2258_7Cw/exec";

        const userJson = localStorage.getItem('currentUser');
        if (!userJson) window.location.href = 'login.html';
        const user = JSON.parse(userJson);

        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        });

        async function loadExams() {
            try {
                const url = `${API_URL}?action=getExamsPageData&login=${encodeURIComponent(user.login)}`;
                const response = await fetch(url);
                const data = await response.json();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                const upcomingBlock = document.getElementById('upcomingBlock');
                const finishedBlock = document.getElementById('finishedBlock');
                const mySignups = data.signups || [];

                if (!data.upcoming || data.upcoming.length === 0) {
                    upcomingBlock.innerHTML = `<section class="card"><p style="color: #888;">Предстоящих экзаменов пока нет.</p></section>`;
                } else {
                    upcomingBlock.innerHTML = data.upcoming.map(exam => {
                        const isSigned = mySignups.includes(exam.title);
                        const isOpen = exam.signupOpen !== false;

                        return `
                            <div class="exam-card" style="${!isOpen ? 'border-left-color: #e74c3c;' : ''}">
                                <h3>${exam.title}</h3>
                                <p class="meta">📅 ${exam.date}${exam.time ? ', ' + exam.time : ''}</p>
                                ${exam.duration ? `<p class="meta">⏱ ${exam.duration}</p>` : ''}
                                <p style="margin-top: 10px;">
                                    ${!isOpen
                                        ? '<span class="badge badge-red">Запись закрыта</span>'
                                        : (isSigned
                                            ? '<span class="badge badge-green">Вы записаны</span>'
                                            : '<span class="badge badge-yellow">Не записан</span>')}
                                </p>
                                ${isOpen ? `
                                    <div style="margin-top: 12px;">
                                        ${isSigned
                                            ? `<button class="btn btn-secondary" data-action="cancel" data-exam="${exam.title}">Отменить запись</button>`
                                            : `<button class="btn" style="background: #27ae60;" data-action="signup" data-exam="${exam.title}">✍️ Записаться</button>`}
                                    </div>
                                    ${exam.daysUntilClose !== null ? `
                                        <p style="color: #f39c12; font-size: 13px; margin-top: 8px;">
                                            ⏰ Запись закроется через ${exam.daysUntilClose} дн.
                                        </p>
                                    ` : ''}
                                ` : ''}
                            </div>
                        `;
                    }).join('');
                }

                if (!data.finished || data.finished.length === 0) {
                    finishedBlock.innerHTML = `<section class="card"><p style="color: #888;">Прошедших экзаменов пока нет.</p></section>`;
                } else {
                    finishedBlock.innerHTML = data.finished.map(exam => `
                        <div class="exam-card" style="border-left-color: #95a5a6;">
                            <h3>${exam.title}</h3>
                            <p class="meta">📅 ${exam.date}${exam.time ? ', ' + exam.time : ''}</p>
                            <a href="stats.html" class="btn btn-secondary" style="margin-top: 12px;">Разбор</a>
                        </div>
                    `).join('');
                }

                // Обработчики кнопок
                document.querySelectorAll('button[data-action]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const action = btn.getAttribute('data-action');
                        const examTitle = btn.getAttribute('data-exam');
                        const apiAction = action === 'signup' ? 'signup' : 'cancelSignup';

                        document.getElementById('loading').style.display = 'block';
                        document.getElementById('content').style.display = 'none';

                        const url = `${API_URL}?action=${apiAction}&login=${encodeURIComponent(user.login)}&exam=${encodeURIComponent(examTitle)}`;
                        const resp = await fetch(url);
                        const res = await resp.json();

                        if (!res.success) alert('❌ ' + (res.error || 'Ошибка'));
                        loadExams();
                    });
                });

            } catch (error) {
                document.getElementById('loading').innerHTML = `
                    <p style="color: #e74c3c;">Ошибка загрузки: ${error.message}</p>
                    <button class="btn" style="margin-top: 16px;" onclick="location.reload()">
                        Попробовать снова
                    </button>
                `;
            }
        }

        loadExams();
    </script>

</body>
</html>
